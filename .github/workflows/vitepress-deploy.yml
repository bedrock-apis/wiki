name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    # push:
      # branches: [ main ]
    # pull_request:
      # branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10  # Specify the version of pnpm you want to install
      - name: Install dependencies
        run: pnpm install
      - uses: actions/configure-pages@v1
      - run: npm ci && npm run docs:build
      - uses: actions/upload-pages-artifact@v1
        with:
          path: ./.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v1
        id: deployment